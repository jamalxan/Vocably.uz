# Vocably realtime (socket.io: presence, xabarlar, qo'ng'iroq signalingi) + coturn (STUN/TURN).
# Azure VM 20.219.147.37 sxemasi (2026-11-06 dan; avval VPS 185.237.97.126) (docs/chat/CALLS_SPEC.md §8.3):
# - `realtime` tashqariga port OCHMAYDI — shu serverdagi umumiy edge Caddy (jamolxon-caddy, jamolxon_edge tarmog'i)
#   uni konteyner nomi bilan topadi: `ws.vocably.uz { reverse_proxy vocably-realtime:4001 }`
#   (Caddyfile.snippet).
# - `coturn` host tarmog'ida (UDP/TCP 3478 + relay UDP 49160-49360, Azure NSG'da ochiladi) —
#   NAT ortidagi relay portlarini Docker port-mapping orqali o'tkazish amalda ishlamaydi.
# Ishga tushirish: `cp .env.example .env && chmod 600 .env` (qiymatlarni to'ldiring),
# `chmod 644 coturn/turnserver.conf`, keyin `docker compose up -d --build`.
services:
  realtime:
    build: .
    container_name: vocably-realtime
    restart: unless-stopped
    env_file: .env
    expose:
      - '4001'
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  coturn:
    image: coturn/coturn:4.18
    container_name: vocably-coturn
    restart: unless-stopped
    network_mode: host
    # TURN_SECRET shu yerdan (konteyner env'iga) keladi. coturn konfiguratsiya faylida env
    # o'zgaruvchilarini ochmaydi, shuning uchun sir faylda EMAS — buyruq satrida beriladi.
    # `$$` — compose interpolatsiyasi emas, konteyner ichidagi sh o'zgaruvchisi.
    # Faqat TURN_SECRET (compose .env dan interpolatsiya) — REALTIME_SHARED_SECRET coturn'ga kerak emas.
    environment:
      TURN_SECRET: ${TURN_SECRET}
    # coturn root EMAS (nobody) bo'lib ishlaydi: fayl o'qiladigan bo'lishi shart (chmod 644),
    # faqat o'qish uchun ulanadi.
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    entrypoint:
      - sh
      - -c
      - '[ -n "$$TURN_SECRET" ] || { echo "TURN_SECRET sozlanmagan" >&2; exit 1; }; exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET"'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  edge:
    external: true
    name: jamolxon_edge
