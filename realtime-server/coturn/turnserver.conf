# coturn (STUN + TURN) — turn.vocably.uz, docs/chat/CALLS_SPEC.md §8.2.
# static-auth-secret bu faylda YO'Q: u TURN_SECRET'dan buyruq satrida beriladi
# (docker-compose.yml, coturn faylda env o'zgaruvchilarini ochmaydi).
# Fayl non-root coturn foydalanuvchisi o'qiy olishi uchun 0644 bo'lishi kerak.
# `no-cli` qo'yilmagan: coturn 4.18'da eskirgan (deprecated) deb ogohlantiradi.
listening-port=3478
listening-ip=0.0.0.0
# Azure: public IP NAT ortida, VM'ning o'zi 10.0.0.4 ni ko'radi -> public/private juftligi.
external-ip=20.219.147.37/10.0.0.4
realm=turn.vocably.uz
use-auth-secret
min-port=49160
max-port=49360
fingerprint
no-tls
no-dtls
no-multicast-peers
no-tcp-relay
stale-nonce=600
user-quota=12
total-quota=1200
max-bps=1500000
log-file=stdout
pidfile=/tmp/turnserver.pid
# Relay xususiy tarmoqlarga (shu hostdagi boshqa konteynerlar, Garage) yetib bormasin.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
